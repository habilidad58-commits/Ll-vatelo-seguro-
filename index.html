<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llévatelo Seguro - Compra Directa y Segura</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --success: #10b981;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 3rem; }

        /* Header & Banner */
        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white; padding: 1.5rem 1rem; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
        .logo-title { font-size: 1.6rem; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #fff; }
        .trust-badge { font-size: 0.8rem; background: rgba(16,185,129,0.2); color: #34d399; padding: 4px 10px; border-radius: 20px; font-weight: 600; border: 1px solid rgba(16,185,129,0.3); }

        .search-wrapper { display: flex; gap: 10px; flex-wrap: wrap; }
        .search-wrapper input {
            flex: 1; min-width: 200px; padding: 0.8rem 1rem; border-radius: 10px;
            border: none; outline: none; font-size: 0.95rem; background: #ffffff;
        }
        .search-wrapper select {
            padding: 0.8rem 1rem; border-radius: 10px; border: none; outline: none; font-size: 0.95rem; background: #ffffff; cursor: pointer;
        }

        /* Container principal */
        main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .grid-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.5rem; }

        /* Tarjeta */
        .card {
            background: var(--card-bg); border-radius: 16px; overflow: hidden;
            border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -8px rgba(0,0,0,0.12); }

      /* Galería Tarjeta */
        .card-gallery { position: relative; height: 220px; background: #f1f5f9; overflow: hidden; }
        .scroll-gallery {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            width: 100%; height: 100%; scrollbar-width: none; -ms-overflow-style: none;
        }
        .scroll-gallery::-webkit-scrollbar { display: none; }
        .scroll-gallery img {
            flex: 0 0 100%; height: 100%; object-fit: cover;
            scroll-snap-align: start; cursor: pointer;
        }
        .badge-verificado {
            position: absolute; top: 12px; right: 12px; background: var(--success);
            color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); pointer-events: none;
        }

        .card-body { padding: 1.25rem; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text); }
        .card-desc { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.4; flex: 1; }

        .card-info { font-size: 0.82rem; background: #f8fafc; padding: 0.6rem 0.8rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid #f1f5f9; }
        .card-info div { margin-bottom: 3px; }

        .card-price { font-size: 1.6rem; font-weight: 800; color: var(--primary); margin-bottom: 1rem; }

        .btn-buy {
            background-color: var(--primary); color: white; text-align: center;
            padding: 0.8rem; border-radius: 10px; text-decoration: none; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s;
        }
        .btn-buy:hover { background-color: var(--primary-dark); }

        /* Modal Imagen Completa / Lightbox */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; padding: 1rem;
        }
        .modal-content { max-width: 90%; max-height: 85vh; border-radius: 8px; object-fit: contain; }
        .modal-close { position: absolute; top: 20px; right: 25px; color: white; font-size: 2rem; cursor: pointer; font-weight: bold; z-index: 1002; }
        .modal-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.2); color: white; border: none; padding: 12px 18px;
            cursor: pointer; border-radius: 50%; font-size: 1.5rem; backdrop-filter: blur(4px); z-index: 1001;
        }
        .modal-btn.prev { left: 15px; }
        .modal-btn.next { right: 15px; }
        .modal-counter {
            position: absolute; bottom: 20px; color: white; font-size: 0.9rem;
            background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 12px;
        }

        .empty-state { text-align: center; padding: 4rem 1rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="logo-title">🛡️ Llévatelo Seguro</div>
                <span class="trust-badge">✔️ Compras Verificadas</span>
            </div>
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="¿Qué buscas hoy? Ej: Samsung, PS5...">
                <select id="filterSelect">
                    <option value="todos">Todos los Estados</option>
                    <option value="Nuevo">Nuevos</option>
                    <option value="Usado">Usados</option>
                </select>
            </div>
        </div>
    </header>

    <main>
        <div class="grid-products" id="productGrid">
            <div class="empty-state">Cargando catálogo en tiempo real...</div>
        </div>
    </main>

    <!-- Modal para ver foto en grande -->
    <div class="modal" id="imageModal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <button class="modal-btn prev" id="modalPrevBtn" onclick="cambiarFotoModal(-1)">❮</button>
        <img class="modal-content" id="modalImage" alt="Foto Ampliada">
        <button class="modal-btn next" id="modalNextBtn" onclick="cambiarFotoModal(1)">❯</button>
        <div class="modal-counter" id="modalCounter"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDFCJfaYGgcgQuRia1qc4hmZkEWmiBuX2k",
          authDomain: "llevatelo-seguro.firebaseapp.com",
          databaseURL: "https://llevatelo-seguro-default-rtdb.firebaseio.com",
          projectId: "llevatelo-seguro",
          storageBucket: "llevatelo-seguro.firebasestorage.app",
          messagingSenderId: "1010159796781",
          appId: "1:1010159796781:web:42706c5108a2fc08ceaea4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let todosLosProductos = {};
        // Guardar índices activos de fotos por producto
        let fotoIndices = {};

        const grid = document.getElementById('productGrid');

        onValue(ref(db, 'productos'), (snapshot) => {
            todosLosProductos = snapshot.val() || {};
            renderProducts();
        });

        function renderProducts() {
            grid.innerHTML = '';
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('filterSelect').value;

            const keys = Object.keys(todosLosProductos);

            if(keys.length === 0) {
                grid.innerHTML = '<div class="empty-state">No hay productos publicados por el momento. ¡Vuelve pronto!</div>';
                return;
            }

            let contador = 0;

            keys.forEach(key => {
                const prod = todosLosProductos[key];
                
                // Normalizar fotos por si Firebase devuelve objeto o array
                const fotos = Array.isArray(prod.fotos) ? prod.fotos : (prod.fotos ? Object.values(prod.fotos) : []);

                // Filtros
                const coincideNombre = prod.nombre.toLowerCase().includes(search) || prod.descripcion.toLowerCase().includes(search);
                const coincideEstado = filter === 'todos' || prod.estado.includes(filter);

                if(coincideNombre && coincideEstado) {
                    contador++;
                    
                    // Crear las imágenes para el carrusel horizontal
                    const imageTags = fotos.map((foto, index) => 
                        `<img src="${foto}" onclick="openModal('${key}', ${index})" alt="${prod.nombre} - Foto ${index + 1}" loading="lazy">`
                    ).join('');

                    const mensajeWa = encodeURIComponent(`Hola, estoy interesado en comprar: *${prod.nombre}* ($${prod.precioVenta}) visto en Llévatelo Seguro.`);
                    const linkWa = `https://wa.me/584120000000?text=${mensajeWa}`;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-gallery">
                            <div class="scroll-gallery">
                                ${imageTags}
                            </div>
                            ${prod.verificado ? '<div class="badge-verificado">✔️ Verificado</div>' : ''}
                        </div>

                        <div class="card-body">
                            <h2 class="card-title">${prod.nombre}</h2>
                            <p class="card-desc">${prod.descripcion}</p>
                            <div class="card-info">
                                <div>📍 <strong>Ubicación:</strong> ${prod.ubicacion}</div>
                                <div>📦 <strong>Estado:</strong> ${prod.estado}</div>
                                <div>💳 <strong>Pago:</strong> ${prod.metodoPago}</div>
                            </div>
                            <div class="card-price">$${prod.precioVenta}</div>
                            <a href="${linkWa}" target="_blank" class="btn-buy">💬 Comprar vía WhatsApp</a>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });
            if(contador === 0) {
                grid.innerHTML = '<div class="empty-state">No se encontraron productos con esos criterios de búsqueda.</div>';
            }
        }
let currentModalKey = null;
        let currentModalIndex = 0;

        window.openModal = function(key, index = 0) {
            currentModalKey = key;
            currentModalIndex = index;
            actualizarModal();
            document.getElementById('imageModal').style.display = 'flex';
        };

        function actualizarModal() {
            if (!currentModalKey || !todosLosProductos[currentModalKey]) return;
            const prod = todosLosProductos[currentModalKey];
            const fotos = Array.isArray(prod.fotos) ? prod.fotos : Object.values(prod.fotos);
            const total = fotos.length;

            document.getElementById('modalImage').src = fotos[currentModalIndex];
             
            const prevBtn = document.getElementById('modalPrevBtn');
            const nextBtn = document.getElementById('modalNextBtn');
            const counter = document.getElementById('modalCounter');

            if (total > 1) {
                prevBtn.style.display = 'block';
                nextBtn.style.display = 'block';
                counter.style.display = 'block';
                counter.innerText = (currentModalIndex + 1) + ' / ' + total;
            } else {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                counter.style.display = 'none';
            }
        }

        window.cambiarFotoModal = function(dir) {
            if (!currentModalKey || !todosLosProductos[currentModalKey]) return;
            const prod = todosLosProductos[currentModalKey];
            const fotos = Array.isArray(prod.fotos) ? prod.fotos : Object.values(prod.fotos);
            currentModalIndex = (currentModalIndex + dir + fotos.length) % fotos.length;
            
            actualizarModal();
        };

        window.closeModal = function() {
            document.getElementById('imageModal').style.display = 'none';
        };
        
        

        document.getElementById('searchInput').addEventListener('input', renderProducts);
        document.getElementById('filterSelect').addEventListener('change', renderProducts);
    </script>
</body>
</html>
