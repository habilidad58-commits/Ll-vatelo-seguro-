<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Divisas</title>
    <style>
        /* Variables de Tema Claro (Por Defecto) */
        :root {
            --bg-body: #f4f5f9;
            --bg-container: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --accent-color: #d97706; /* Dorado/Naranja de los bolívares */
            --bg-subtab-active: #ffffff;
            --btn-theme-bg: #ffffff;
            --btn-theme-border: #e5e7eb;
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
            --history-badge-bg: rgba(217, 119, 6, 0.1);
        }

        /* Variables de Tema Oscuro */
        [data-theme="dark"] {
            --bg-body: #050505;
            --bg-container: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --border-color: #1f2937;
            --accent-color: #d97706;
            --bg-subtab-active: #0a0a0a;
            --btn-theme-bg: #111827;
            --btn-theme-border: #374151;
            --shadow: 0 4px 20px rgba(0,0,0,0.5);
            --history-badge-bg: rgba(217, 119, 6, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }

        /* Header y Botón de Tema */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo-placeholder {
            width: 32px;
            height: 32px;
            /* Simulación del logo de la app */
            background: conic-gradient(from 90deg, #ef4444, #3b82f6, #f59e0b);
            border-radius: 50%;
            mask: radial-gradient(transparent 40%, black 41%);
            -webkit-mask: radial-gradient(transparent 40%, black 41%);
        }

        .theme-btn {
            background-color: var(--btn-theme-bg);
            border: 1px solid var(--btn-theme-border);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            outline: none;
        }

        .theme-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Tabs de navegación superior */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--text-primary);
            border-bottom: 2px solid var(--accent-color);
        }

        /* Tarjeta Principal (Mercado) */
        .main-card {
            background-color: var(--bg-container);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            overflow: hidden;
        }

        /* Sub-tabs de tasas */
        .sub-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .sub-tab {
            flex: 1;
            text-align: center;
            padding: 16px 0;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            background-color: transparent;
        }

        .sub-tab.active {
            color: var(--text-primary);
            border-bottom: 2px solid var(--accent-color);
        }

        /* Área de conversión y campos de entrada */
        .input-area {
            padding: 24px;
        }

        .input-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .currency-symbol {
            font-size: 36px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .amount-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 36px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .input-label-small {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            margin-top: 24px;
            font-weight: 700;
        }

        .divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 20px 0;
        }

        .ves-text {
            color: var(--accent-color) !important;
        }

        /* Lista de Tasas Actuales */
        .rates-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 8px;
        }

        .rates-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .rates-ref {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .rates-card {
            background-color: var(--bg-container);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            box-shadow: var(--shadow);
        }

        .rate-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .rate-row:last-child {
            border-bottom: none;
        }

        .rate-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .rate-sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .rate-value {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-primary);
        }

        /* Pestaña de Historial */
        .history-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            padding: 0 8px;
        }

        .history-card {
            background-color: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .history-time {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .history-badge {
            background-color: var(--history-badge-bg);
            color: var(--accent-color);
            font-size: 10px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .history-body {
            display: flex;
            align-items: center;
        }

        .history-col {
            flex: 1;
        }

        .history-divider {
            width: 1px;
            height: 35px;
            background-color: var(--border-color);
            margin: 0 16px;
        }

        .history-label {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .history-val {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-primary);
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Encabezado y Botón de Tema -->
    <div class="top-header">
        <div class="logo-placeholder"></div>
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
            <!-- Icono Luna (Modo Claro) -->
            <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <!-- Icono Sol (Modo Oscuro) -->
            <svg id="sun-icon" style="display:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
    </div>

    <!-- Pestañas Principales -->
    <div class="tabs">
        <div class="tab active" onclick="switchMainTab('mercado', this)">MERCADO</div>
        <div class="tab" onclick="switchMainTab('historial', this)">HISTORIAL</div>
    </div>

    <!-- VISTA: MERCADO -->
    <div id="view-mercado">
        <div class="main-card">
            <!-- Selección de Tasa Fuente -->
            <div class="sub-tabs">
                <div class="sub-tab active" onclick="setTasa(832.49, this)">BCV $</div>
                <div class="sub-tab" onclick="setTasa(968.07, this)">BCV €</div>
                <div class="sub-tab" onclick="setTasa(962.00, this)">USDT</div>
            </div>

            <!-- Campos de Conversión (Diseño idéntico a la imagen) -->
            <div class="input-area">
                <div class="input-row">
                    <span class="currency-symbol">$</span>
                    <input type="text" id="inputUSD" class="amount-input" inputmode="numeric" placeholder="1,00">
                </div>

                <div class="divider"></div>

                <div class="input-label-small">BOLÍVARES (VES)</div>
                <div class="input-row">
                    <span class="currency-symbol ves-text">Bs.</span>
                    <input type="text" id="inputVES" class="amount-input ves-text" inputmode="numeric" placeholder="832,49">
                </div>
            </div>
        </div>

        <!-- Listado de Tasas -->
        <div class="rates-header">
            <span class="rates-title">Tasas Actuales</span>
            <span class="rates-ref">Ref. Oficiales</span>
        </div>
        <div class="rates-card">
            <div class="rate-row">
                <div>
                    <div class="rate-name">Dólar Oficial</div>
                    <div class="rate-sub">BCV / VES</div>
                </div>
                <div class="rate-value">832,49 Bs.</div>
            </div>
            <div class="rate-row">
                <div>
                    <div class="rate-name">USDT P2P</div>
                    <div class="rate-sub">Binance / VES</div>
                </div>
                <div class="rate-value">961,55 Bs.</div>
            </div>
            <div class="rate-row">
                <div>
                    <div class="rate-name">Euro Oficial</div>
                    <div class="rate-sub">BCV / VES</div>
                </div>
                <div class="rate-value">968,07 Bs.</div>
            </div>
        </div>
    </div>

    <!-- VISTA: HISTORIAL -->
    <div id="view-historial" style="display: none;">
        <h3 class="history-title">Historial de Variaciones</h3>
        <div id="history-list">
            <!-- El contenido se inyecta dinámicamente mediante JS -->
        </div>
    </div>

</div>

<script>
    // --- LÓGICA DEL TEMA ---
    function toggleTheme() {
        const html = document.documentElement;
        const moon = document.getElementById('moon-icon');
        const sun = document.getElementById('sun-icon');
        
        if (html.getAttribute('data-theme') === 'dark') {
            html.removeAttribute('data-theme');
            moon.style.display = 'block';
            sun.style.display = 'none';
        } else {
            html.setAttribute('data-theme', 'dark');
            moon.style.display = 'none';
            sun.style.display = 'block';
        }
    }

    // --- LÓGICA DE PESTAÑAS (MERCADO / HISTORIAL) ---
    function switchMainTab(tabName, element) {
        document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
        element.classList.add('active');

        if (tabName === 'mercado') {
            document.getElementById('view-mercado').style.display = 'block';
            document.getElementById('view-historial').style.display = 'none';
        } else {
            document.getElementById('view-mercado').style.display = 'none';
            document.getElementById('view-historial').style.display = 'block';
            renderizarHistorial();
        }
    }

    // --- LÓGICA DEL HISTORIAL DE TRANSACCIONES ---
    // Datos simulados exactamente como en tu captura de pantalla
    const historialDatos = [
        { fecha: '10/9/2026', hora: '7:00 p. m.', bcv: '832.4883', binance: '961.55' },
        { fecha: '10/9/2026', hora: '6:55 p. m.', bcv: '832.4883', binance: '961.89' },
        { fecha: '10/9/2026', hora: '6:40 p. m.', bcv: '832.4883', binance: '962.02' },
        { fecha: '10/9/2026', hora: '6:36 p. m.', bcv: '832.4883', binance: '962.58' },
        { fecha: '10/9/2026', hora: '6:25 p. m.', bcv: '832.4883', binance: '962.04' }
    ];

    function renderizarHistorial() {
        const list = document.getElementById('history-list');
        list.innerHTML = ''; // Limpiar antes de renderizar
        
        historialDatos.forEach(item => {
            list.innerHTML += `
                <div class="history-card">
                    <div class="history-header">
                        <div class="history-time">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            ${item.fecha} • ${item.hora}
                        </div>
                        <div class="history-badge">REF</div>
                    </div>
                    <div class="history-body">
                        <div class="history-col">
                            <div class="history-label">BCV USD</div>
                            <div class="history-val">Bs. ${item.bcv}</div>
                        </div>
                        <div class="history-divider"></div>
                        <div class="history-col">
                            <div class="history-label">BINANCE P2P</div>
                            <div class="history-val">Bs. ${item.binance}</div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // --- LÓGICA DE LA CALCULADORA (Adaptada al nuevo diseño fijo) ---
    let tasaActual = 832.49;
    let centavosUsd = 0;
    let centavosVes = 0;

    function setTasa(nuevaTasa, elemento) {
        tasaActual = nuevaTasa;
        document.querySelectorAll('.sub-tab').forEach(tab => tab.classList.remove('active'));
        elemento.classList.add('active');
        calcularDesdeUsd();
    }

    function formatearNumero(centavos) {
        let valor = centavos / 100;
        // Si el valor es cero, no mostrar para simular el placeholder, o mostrar 0,00
        if (centavos === 0) return ""; 
        return valor.toLocaleString('de-DE', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 4 // Permitido hasta 4 decimales como en tu captura (.4883)
        });
    }

    function vincularEventos() {
        const inputUSD = document.getElementById('inputUSD');
        const inputVES = document.getElementById('inputVES');

        inputUSD.addEventListener('keydown', (e) => manejarTeclado(e, 'USD'));
        inputVES.addEventListener('keydown', (e) => manejarTeclado(e, 'VES'));

        // Prevenir ingreso de cursor libre en campos numéricos
        inputUSD.addEventListener('click', (e) => e.target.setSelectionRange(e.target.value.length, e.target.value.length));
        inputVES.addEventListener('click', (e) => e.target.setSelectionRange(e.target.value.length, e.target.value.length));
    }

    function manejarTeclado(e, tipo) {
        if (e.key >= '0' && e.key <= '9') {
            e.preventDefault();
            const digito = parseInt(e.key, 10);
            if (tipo === 'USD') {
                if (centavosUsd < 999999999) centavosUsd = centavosUsd * 10 + digito;
                calcularDesdeUsd();
            } else {
                if (centavosVes < 999999999) centavosVes = centavosVes * 10 + digito;
                calcularDesdeVes();
            }
        } else if (e.key === 'Backspace') {
            e.preventDefault();
            if (tipo === 'USD') {
                centavosUsd = Math.floor(centavosUsd / 10);
                calcularDesdeUsd();
            } else {
                centavosVes = Math.floor(centavosVes / 10);
                calcularDesdeVes();
            }
        } else if (e.key === 'Tab') {
            // Permitir navegación mediante tecla tab
        } else {
            e.preventDefault();
        }
    }

    function calcularDesdeUsd() {
        let valorUsd = centavosUsd / 100;
        let valorVes = valorUsd * tasaActual;
        centavosVes = Math.round(valorVes * 100);
        actualizarDisplays();
    }

    function calcularDesdeVes() {
        let valorVes = centavosVes / 100;
        let valorUsd = tasaActual > 0 ? valorVes / tasaActual : 0;
        centavosUsd = Math.round(valorUsd * 100);
        actualizarDisplays();
    }

    function actualizarDisplays() {
        const inputUSD = document.getElementById('inputUSD');
        const inputVES = document.getElementById('inputVES');
        
        inputUSD.value = formatearNumero(centavosUsd);
        inputVES.value = formatearNumero(centavosVes);
    }

    // Inicializar listeners
    window.onload = function() {
        vincularEventos();
    };
</script>

</body>
</html>
